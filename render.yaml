services:
  - type: web
    name: telegram-country-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_TOKEN
        sync: false   # Set this manually in Render dashboard (optional)
    healthCheckPath: /health
    autoDeploy: true
